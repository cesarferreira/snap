[package]
name = "snap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, minimal macOS window manipulation from the terminal"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/snap"

[[bin]]
name = "snap"
path = "src/main.rs"

[dependencies]
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cocoa = "0.26.1"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"
objc = "0.2.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
