[package]
name = "snap-macos"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, minimal macOS window manipulation from the terminal"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/snap"

[[bin]]
name = "snap"
path = "src/main.rs"

[dependencies]
accessibility-sys = "0.2.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.25.0"
libc = "0.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSAccessibility",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSString",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
